# Checking the recipes (recipes.json) on every change and pull request: only allowed fields and values can be in it
# (seed/validate_recipes.py, the same rules as on Sloth OS machines).
name: recipes

on:
  push:
    paths:
      - "recipes.json"
      - "seed/validate_recipes.py"
      - ".github/workflows/recipes.yml"
  pull_request:
    paths:
      - "recipes.json"
      - "seed/validate_recipes.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the recipes
        run: python3 seed/validate_recipes.py recipes.json
