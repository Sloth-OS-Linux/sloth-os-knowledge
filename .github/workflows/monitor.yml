# Watching the Sloth OS knowledge service (daily): does the Worker answer, and does the export work.
# If not, an issue opens (the repository's owner gets an e-mail about it); when it works again, the issue closes.
name: monitor

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check
        id: check
        env:
          EXPORT_URL: ${{ secrets.EXPORT_URL }}
          EXPORT_TOKEN: ${{ secrets.EXPORT_TOKEN }}
        run: |
          problems=""
          base="${EXPORT_URL%/v1/export}"
          if ! curl -fsS --retry 3 --max-time 30 "$base/" | jq -e '.service == "Sloth OS knowledge"' > /dev/null; then
            problems="$problems- The Worker does not answer: $base/"$'\n'
          fi
          # it must refuse a bad report (the validation works)
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -X POST "$base/v1/report" \
                 -H 'content-type: application/json' -d '{"bad": true}')
          if [ "$code" != "400" ]; then
            problems="$problems- The report validation does not give the expected answer (HTTP $code, expected: 400)"$'\n'
          fi
          if ! curl -fsS --retry 3 --max-time 60 -H "Authorization: Bearer $EXPORT_TOKEN" "$EXPORT_URL" \
               | jq -e '.version == 1 and (.programs | type == "object")' > /dev/null; then
            problems="$problems- The export does not work (the database or the secret key may be the problem)"$'\n'
          fi
          {
            echo "problems<<EOF"
            printf '%s' "$problems"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          PROBLEMS: ${{ steps.check.outputs.problems }}
        run: |
          title="The shared knowledge service does not work"
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$PROBLEMS" ]; then
            body=$(printf 'The daily check found a problem (%s):\n\n%s\nMeanwhile the machines read the knowledge collected so far from GitHub, and keep their reports queued to send later, so users do not notice anything.\n\nDetails: %s/%s/actions/runs/%s' \
                   "$(date -u +%F)" "$PROBLEMS" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
            if [ -n "$open" ]; then
              gh issue comment "$open" -R "$GITHUB_REPOSITORY" --body "$body"
            else
              gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
            fi
            exit 1
          elif [ -n "$open" ]; then
            gh issue close "$open" -R "$GITHUB_REPOSITORY" --comment "Working again ($(date -u +%F))."
          fi
          echo "All good."
