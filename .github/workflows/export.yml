# The shared knowledge's summary from the Sloth OS knowledge service (hourly): the settings that worked on Sloth OS
# machines (programs) and the ones reported not to work anymore (disputed).
# Secrets: EXPORT_URL (https://<worker>/v1/export) and EXPORT_TOKEN.
name: export

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download the summary
        env:
          EXPORT_URL: ${{ secrets.EXPORT_URL }}
          EXPORT_TOKEN: ${{ secrets.EXPORT_TOKEN }}
        run: |
          if [ -z "$EXPORT_URL" ] || [ -z "$EXPORT_TOKEN" ]; then
            echo "The secrets are not set yet, skipped."
            exit 0
          fi
          curl -fsS --retry 3 --max-time 60 -H "Authorization: Bearer $EXPORT_TOKEN" "$EXPORT_URL" -o new.json
          # only a valid file of the expected shape can go out (the machines download it)
          jq -e '.version == 1 and (.programs | type == "object")' new.json > /dev/null
          # next to the games summarized from ProtonDB (games.json, updated monthly)
          if [ -f games.json ]; then
            jq -S --indent 1 -s '.[0] + .[1]' new.json games.json > knowledge.json
          else
            jq -S --indent 1 . new.json > knowledge.json
          fi
          rm new.json

      - name: Commit if it changed (and a monthly heartbeat, so GitHub keeps the schedule on)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet knowledge.json; then
            git add knowledge.json
            git commit -m "Shared knowledge updated"
            git push
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 30 * 86400 )) ]; then
            git commit --allow-empty -m "Heartbeat (keeps the scheduled update active)"
            git push
          fi
